apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-doc-intelligence
  labels:
    app: rag-doc-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-doc-intelligence
  template:
    metadata:
      labels:
        app: rag-doc-intelligence
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: rag-doc-intelligence:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
