apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-doc-intelligence
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - host: rag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-doc-intelligence
                port:
                  number: 80
