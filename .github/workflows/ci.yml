name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-doc-intelligence:${{ github.sha }} .
      # In production: push to ECR and roll out to EKS, e.g.
      # - aws ecr get-login-password | docker login ...
      # - docker push <account>.dkr.ecr.<region>.amazonaws.com/rag:<sha>
      # - kubectl set image deployment/rag-doc-intelligence api=...:<sha>
