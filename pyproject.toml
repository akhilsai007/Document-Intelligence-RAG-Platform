[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-doc-intelligence"
version = "0.1.0"
description = "Document intelligence RAG platform (Spark + Snowflake + XGBoost + FastAPI + LLM)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*", "config*"]
